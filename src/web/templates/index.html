<!DOCTYPE html>
<html>
<head>
    <title>工业级边缘网关</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .nav { margin-bottom: 20px; }
        .nav a { margin-right: 20px; font-size: 18px; }
        .card { border: 1px solid #ccc; padding: 20px; margin: 20px; border-radius: 10px; }
    </style>
</head>
<body>
    <div class="nav">
        <a href="/">首页</a>
        <a href="/sensors">传感器数据</a>
        <a href="/alerts">告警信息</a>
    </div>
    
    <div class="card">
        <h1>工业级边缘网关</h1>
        <p>基于 RK3568 的工业级边缘网关项目</p>
        <ul>
            <li>支持 RS485/RS232 串口通信</li>
            <li>支持 Modbus RTU/TCP 协议</li>
            <li>支持 ZigBee 无线通信</li>
            <li>支持 MQTT 云平台对接</li>
            <li>支持 SQLite 数据存储</li>
            <li>支持异常检测与告警</li>
        </ul>
    </div>
</body>
</html>
