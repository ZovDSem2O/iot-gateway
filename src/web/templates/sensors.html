<!DOCTYPE html>
<html>
<head>
    <title>传感器数据</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .nav { margin-bottom: 20px; }
        .nav a { margin-right: 20px; font-size: 18px; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        .refresh { margin-bottom: 10px; padding: 10px; }
    </style>
</head>
<body>
    <div class="nav">
        <a href="/">首页</a>
        <a href="/sensors">传感器数据</a>
        <a href="/alerts">告警信息</a>
    </div>
    
    <h1>传感器数据</h1>
    <button class="refresh" onclick="loadData()">刷新数据</button>
    
    <table id="sensorTable">
        <thead>
            <tr>
                <th>ID</th>
                <th>设备类型</th>
                <th>设备ID</th>
                <th>温度(°C)</th>
                <th>湿度(%)</th>
                <th>采集时间</th>
            </tr>
        </thead>
        <tbody id="sensorBody">
        </tbody>
    </table>

    <script>
        function loadData() {
            fetch('/api/sensors')
                .then(response => response.json())
                .then(data => {
                    let html = '';
                    data.forEach(row => {
                        html += '<tr>';
                        html += `<td>${row.id}</td>`;
                        html += `<td>${row.device_type}</td>`;
                        html += `<td>${row.device_id}</td>`;
                        html += `<td>${row.temperature}</td>`;
                        html += `<td>${row.humidity}</td>`;
                        html += `<td>${row.timestamp}</td>`;
                        html += '</tr>';
                    });
                    document.getElementById('sensorBody').innerHTML = html;
                });
        }
        
        loadData();
        setInterval(loadData, 5000);
    </script>
</body>
</html>
